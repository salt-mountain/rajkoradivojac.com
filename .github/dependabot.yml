version: 2
updates:
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 10
    # Age-gate: don't open an update PR until the new version has been published
    # for this many days. Mitigates supply-chain attacks where a poisoned release
    # is usually detected and yanked within a few days of publishing.
    cooldown:
      default-days: 7
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 7
    # TypeScript 7 is the native (Go) compiler rewrite and ships no JS compiler
    # API. Both fleet typecheckers break on it: `astro check` (@astrojs/check
    # supports TS "^5 || ^6") and `vue-tsc` (wraps `typescript/lib/tsc`, removed
    # in TS7). Stay on the 6.x line — patch/minor (incl. security) still flow —
    # until both declare TS7 support.
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    # Batch non-major updates into one PR per run so fewer PRs race each other
    # to main (auto-merge doesn't require up-to-date branches). Majors stay
    # separate PRs for a human; .github/workflows/automerge.yml merges the rest.
    groups:
      bun-minor-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
      bun-security:
        applies-to: security-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      actions-minor-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # The CDK infra app (its own package.json + bun.lock, separate from the
  # root). verify typechecks and synthesizes it, so its non-major updates
  # auto-merge too; CDK deploys stay manual (`cdk deploy`), so a merged
  # update never changes AWS by itself. No TypeScript ignore: infra already
  # runs TypeScript 7 (plain tsc, no astro check / vue-tsc).
  - package-ecosystem: "bun"
    directory: "/infra"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 7
    groups:
      infra-minor-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
      infra-security:
        applies-to: security-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
